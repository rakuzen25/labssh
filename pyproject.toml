[project]
name = "labssh"
version = "0.1.0"
description = "Lightweight, live SSH host selection for shared Linux labs"
readme = "README.md"
authors = [
    { name = "Frank", email = "25704248+rakuzen25@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = ["rich>=13.9,<15"]

[project.scripts]
labssh = "labssh.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "docs/**", "config.example.toml"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.basedpyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
